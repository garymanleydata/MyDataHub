name: Weekly parkrun BAU Sync

on:
  schedule:
    - cron: '0 11 * * 6' 
    - cron: '0 13 * * 6' 
    - cron: '0 15 * * 6' 
    - cron: '0 18 * * 6'

  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Delta Sync
        run: |
          python sync_parkrun.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/parkrun_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated parkrun data sync [skip ci]" && git push)
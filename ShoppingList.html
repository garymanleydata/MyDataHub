<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Trolley Sync</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    [x-cloak] { display: none !important; }
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24 font-sans antialiased" x-data="shoppingApp" x-init="initFirebase()">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-30 bg-white border-b border-slate-200 px-4 py-3 shadow-xs">
    <div class="flex items-center justify-between max-w-md mx-auto">
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-800">Trolley Sync</h1>
        <p class="text-xs text-slate-500 font-medium" x-text="statusText"></p>
      </div>
      
      <!-- Mode Toggle -->
      <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs font-semibold">
        <button 
          @click="viewMode = 'shop'"
          :class="viewMode === 'shop' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600'"
          class="px-3 py-1.5 rounded-md transition-all">Shop</button>
        <button 
          @click="viewMode = 'plan'"
          :class="viewMode === 'plan' ? 'bg-indigo-600 text-white shadow-xs' : 'text-slate-600'"
          class="px-3 py-1.5 rounded-md transition-all">Plan</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- ================= SHOPPING MODE ================= -->
    <div x-show="viewMode === 'shop'" class="space-y-4">

      <!-- Quick Add Input -->
      <div class="flex gap-2">
        <input 
          type="text" 
          x-model="quickItemName" 
          @keydown.enter="quickAddItem()"
          placeholder="Add one-off item to list..." 
          class="flex-1 bg-white border border-slate-300 text-slate-900 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-xs"
        />
        <button 
          @click="quickAddItem()" 
          class="bg-indigo-600 active:bg-indigo-700 text-white px-5 py-3 rounded-xl font-semibold text-sm shadow-xs transition">
          Add
        </button>
      </div>

      <!-- Needed Items List -->
      <div>
        <div class="flex justify-between items-center mb-2 px-1">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">
            To Find (<span x-text="neededItems.length"></span>)
          </h2>
          <span class="text-xs text-slate-400">Sorted by aisle</span>
        </div>

        <template x-if="neededItems.length === 0">
          <div class="text-center py-10 bg-white border border-dashed border-slate-300 rounded-2xl p-6">
            <p class="text-slate-500 text-sm">Everything is in the trolley!</p>
          </div>
        </template>

        <div class="space-y-2">
          <template x-for="item in neededItems" :key="item.id">
            <div class="bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between shadow-xs transition">
              <!-- Touch Target -->
              <button 
                @click="toggleBasket(item)"
                class="min-h-12 min-w-12 -ml-2 flex items-center justify-center text-slate-300 hover:text-indigo-600 focus:outline-none">
                <div class="w-6 h-6 rounded-md border-2 border-slate-300 flex items-center justify-center"></div>
              </button>

              <!-- Item Details -->
              <div class="flex-1 px-1 cursor-pointer" @click="openEditModal(item)">
                <div class="flex items-baseline gap-2">
                  <span class="font-semibold text-slate-800 text-base" x-text="item.name"></span>
                  <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full" x-text="'x' + item.quantity"></span>
                </div>
                <div class="flex items-center gap-2 text-xs text-slate-500 mt-0.5">
                  <span class="font-medium bg-slate-100 px-1.5 py-0.5 rounded text-slate-600" x-text="item.aisle || 'No Aisle'"></span>
                  <span x-show="item.notes" class="truncate max-w-[150px]" x-text="item.notes"></span>
                </div>
              </div>

              <!-- Product Link -->
              <template x-if="item.url">
                <a :href="item.url" target="_blank" rel="noopener noreferrer" class="p-2 text-slate-400 hover:text-slate-600">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- In Trolley Section -->
      <div x-show="basketItems.length > 0" class="pt-4 border-t border-slate-200">
        <div class="flex justify-between items-center mb-2 px-1">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">
            In Trolley (<span x-text="basketItems.length"></span>)
          </h2>
        </div>

        <div class="space-y-2 opacity-60">
          <template x-for="item in basketItems" :key="item.id">
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 flex items-center justify-between">
              <button 
                @click="toggleBasket(item)"
                class="min-h-12 min-w-12 -ml-2 flex items-center justify-center text-emerald-600 focus:outline-none">
                <div class="w-6 h-6 rounded-md bg-emerald-600 flex items-center justify-center text-white font-bold text-xs">✓</div>
              </button>

              <div class="flex-1 px-1 line-through text-slate-500 text-sm">
                <span x-text="item.name"></span>
                <span class="text-xs font-normal" x-text="'(x' + item.quantity + ')'"></span>
              </div>

              <button @click="removeFromActiveList(item)" class="text-xs text-rose-500 font-medium px-2 py-1">
                Remove
              </button>
            </div>
          </template>
        </div>
      </div>

    </div>

    <!-- ================= PLANNER / MASTER MODE ================= -->
    <div x-show="viewMode === 'plan'" class="space-y-4" x-cloak>
      
      <!-- Reset Weekly Shopping -->
      <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-xs space-y-3">
        <div class="flex justify-between items-center">
          <div>
            <h2 class="font-bold text-slate-800 text-sm">Start New Week</h2>
            <p class="text-xs text-slate-500">Clears trolley and pulls in all master staples.</p>
          </div>
          <button 
            @click="populateWeekFromMaster()" 
            class="bg-indigo-600 active:bg-indigo-700 text-white text-xs font-semibold px-3.5 py-2 rounded-lg shadow-xs">
            Reset Week
          </button>
        </div>
      </div>

      <!-- Add New Master Item -->
      <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-xs space-y-3">
        <h2 class="font-bold text-slate-800 text-sm">Add New Staple Item</h2>
        <div class="space-y-2">
          <input 
            type="text" 
            x-model="newMaster.name" 
            placeholder="Item name (e.g. Eggs 12pk)" 
            class="w-full border border-slate-300 rounded-lg p-2 text-sm">
          
          <div class="grid grid-cols-2 gap-2">
            <input 
              type="text" 
              x-model="newMaster.aisle" 
              placeholder="Aisle (e.g. Aisle 2)" 
              class="border border-slate-300 rounded-lg p-2 text-sm">
            <input 
              type="number" 
              min="1" 
              x-model.number="newMaster.default_quantity" 
              placeholder="Default Qty" 
              class="border border-slate-300 rounded-lg p-2 text-sm">
          </div>

          <button 
            @click="createMasterItem()" 
            class="w-full bg-slate-800 active:bg-slate-900 text-white font-semibold py-2 rounded-lg text-xs transition">
            Save to Master Catalogue
          </button>
        </div>
      </div>

      <!-- Master Catalogue List -->
      <div>
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2 px-1">
          Master Pantry Catalogue (<span x-text="masterCatalogue.length"></span>)
        </h3>
        
        <div class="space-y-2">
          <template x-for="item in masterCatalogue" :key="item.id">
            <div class="bg-white border border-slate-200 rounded-xl p-3 flex items-center justify-between shadow-xs">
              <div class="flex-1 cursor-pointer" @click="openEditModal(item)">
                <div class="font-semibold text-slate-800 text-sm" x-text="item.name"></div>
                <div class="text-xs text-slate-400" x-text="(item.aisle || 'No Aisle') + ' • Default: ' + item.default_quantity"></div>
              </div>
              <div class="flex items-center gap-2">
                <button 
                  @click="toggleMasterInclusion(item)" 
                  :class="item.in_active_list ? 'bg-emerald-100 text-emerald-800 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'"
                  class="text-xs font-semibold px-3 py-2 rounded-lg border transition"
                  x-text="item.in_active_list ? 'On This Week' : '+ Add to Week'">
                </button>
              </div>
            </div>
          </template>
        </div>
      </div>
    </div>

  </main>

  <!-- ================= ITEM EDIT MODAL ================= -->
  <div 
    x-show="editingItem" 
    class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4"
    x-cloak>
    
    <div 
      @click.away="editingItem = null"
      class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-5 space-y-4 shadow-xl border border-slate-200 max-h-[90vh] overflow-y-auto">
      
      <div class="flex justify-between items-center border-b border-slate-100 pb-2">
        <h3 class="font-bold text-slate-800 text-lg">Edit Details</h3>
        <button @click="editingItem = null" class="text-slate-400 text-xl font-bold">&times;</button>
      </div>

      <template x-if="editingItem">
        <div class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Item Name</label>
            <input type="text" x-model="editingItem.name" class="w-full border border-slate-300 rounded-lg p-2.5">
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Quantity</label>
              <input type="number" min="1" x-model.number="editingItem.quantity" class="w-full border border-slate-300 rounded-lg p-2.5">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Aisle / Location</label>
              <input type="text" placeholder="e.g. Aisle 3" x-model="editingItem.aisle" class="w-full border border-slate-300 rounded-lg p-2.5">
            </div>
          </div>

          <!-- Master Staple Toggle -->
          <div class="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-lg">
            <input 
              type="checkbox" 
              id="is_master_toggle"
              x-model="editingItem.is_master" 
              class="w-5 h-5 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
            <label for="is_master_toggle" class="text-xs text-slate-700 font-medium leading-tight">
              Include in recurring Master Catalogue (auto-included on weekly reset)
            </label>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Notes</label>
            <input type="text" placeholder="Brand, preferences or substitutes" x-model="editingItem.notes" class="w-full border border-slate-300 rounded-lg p-2.5">
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Product URL</label>
            <input type="url" placeholder="https://..." x-model="editingItem.url" class="w-full border border-slate-300 rounded-lg p-2.5">
          </div>

          <div class="pt-2 flex gap-3">
            <button 
              @click="saveItemEdits()" 
              class="flex-1 bg-indigo-600 active:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg shadow-xs">
              Save Changes
            </button>
            <button 
              @click="deleteItem(editingItem.id)" 
              class="bg-rose-50 text-rose-600 border border-rose-200 font-semibold px-4 py-2.5 rounded-lg">
              Delete
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Application Logic & Modules -->
  <script type="module">
    import Alpine from "https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/module.esm.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCH-848wnhHoJtXBKhM7PpYvAOppnI_2Ds",
      authDomain: "trolley-8dc5f.firebaseapp.com",
      projectId: "trolley-8dc5f",
      storageBucket: "trolley-8dc5f.firebasestorage.app",
      messagingSenderId: "273927192038",
      appId: "1:273927192038:web:db02e46d51d6d8faa9ea27"
    };

    Alpine.data('shoppingApp', () => ({
      db: null,
      items: [],
      viewMode: 'shop',
      quickItemName: '',
      newMaster: { name: '', aisle: '', default_quantity: 1 },
      statusText: 'Connecting...',
      editingItem: null,

      initFirebase() {
        try {
          const app = initializeApp(firebaseConfig);
          this.db = getFirestore(app);

          onSnapshot(collection(this.db, "groceries"), (snapshot) => {
            this.items = snapshot.docs.map(docSnap => ({
              id: docSnap.id,
              ...docSnap.data()
            }));
            this.statusText = 'Synced with cloud';
          }, (error) => {
            console.error(error);
            this.statusText = 'Offline / Sync failed';
          });
        } catch (err) {
          console.error(err);
          this.statusText = 'Configuration required';
        }
      },

      get neededItems() {
        return this.items
          .filter(i => i.in_active_list && !i.in_basket)
          .sort((a, b) => (a.aisle || '').localeCompare(b.aisle || '', undefined, { numeric: true }));
      },

      get basketItems() {
        return this.items.filter(i => i.in_active_list && i.in_basket);
      },

      get masterCatalogue() {
        return this.items
          .filter(i => i.is_master)
          .sort((a, b) => (a.aisle || '').localeCompare(b.aisle || '', undefined, { numeric: true }));
      },

      async quickAddItem() {
        const val = this.quickItemName.trim();
        if (!val) return;
        
        await addDoc(collection(this.db, "groceries"), {
          name: val,
          quantity: 1,
          default_quantity: 1,
          aisle: '',
          notes: '',
          url: '',
          is_master: false,
          in_active_list: true,
          in_basket: false,
          created_at: Date.now()
        });

        this.quickItemName = '';
      },

      async createMasterItem() {
        if (!this.newMaster.name.trim()) return;

        await addDoc(collection(this.db, "groceries"), {
          name: this.newMaster.name.trim(),
          aisle: this.newMaster.aisle.trim(),
          default_quantity: Number(this.newMaster.default_quantity) || 1,
          quantity: Number(this.newMaster.default_quantity) || 1,
          notes: '',
          url: '',
          is_master: true,
          in_active_list: true,
          in_basket: false,
          created_at: Date.now()
        });

        this.newMaster = { name: '', aisle: '', default_quantity: 1 };
      },

      async toggleBasket(item) {
        const ref = doc(this.db, "groceries", item.id);
        await updateDoc(ref, {
          in_basket: !item.in_basket
        });
      },

      async populateWeekFromMaster() {
        const batch = writeBatch(this.db);
        this.items.forEach(item => {
          const ref = doc(this.db, "groceries", item.id);
          if (item.is_master) {
            batch.update(ref, {
              in_active_list: true,
              in_basket: false,
              quantity: item.default_quantity || 1
            });
          } else {
            batch.update(ref, { in_active_list: false, in_basket: false });
          }
        });
        await batch.commit();
        this.viewMode = 'shop';
      },

      async toggleMasterInclusion(item) {
        const ref = doc(this.db, "groceries", item.id);
        await updateDoc(ref, {
          in_active_list: !item.in_active_list,
          in_basket: false
        });
      },

      async removeFromActiveList(item) {
        const ref = doc(this.db, "groceries", item.id);
        await updateDoc(ref, { in_active_list: false });
      },

      openEditModal(item) {
        this.editingItem = JSON.parse(JSON.stringify(item));
      },

      async saveItemEdits() {
        if (!this.editingItem) return;
        const ref = doc(this.db, "groceries", this.editingItem.id);
        await updateDoc(ref, {
          name: this.editingItem.name,
          quantity: Number(this.editingItem.quantity) || 1,
          aisle: this.editingItem.aisle || '',
          notes: this.editingItem.notes || '',
          url: this.editingItem.url || '',
          is_master: Boolean(this.editingItem.is_master)
        });
        this.editingItem = null;
      },

      async deleteItem(id) {
        await deleteDoc(doc(this.db, "groceries", id));
        this.editingItem = null;
      }
    }));

    window.Alpine = Alpine;
    Alpine.start();
  </script>
</body>
</html>
